# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/movie_recommendation}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Server
server.port=8080

# JWT Configuration - Use environment variable
jwt.secret=${JWT_SECRET:your_secret_key_very_long_for_security_123456}

# CORS Configuration - Use environment variable or comma-separated list
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
